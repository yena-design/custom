<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YENA Lead Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="index.html"><img src="images/logo_primary.png" alt="YENA Custom Studio"></a>
    <nav class="desktop-nav">
      <a href="index.html">Home</a>
      <a class="active" href="admin-leads.html">Lead Dashboard</a>
    </nav>
  </div>
</header>

<main class="leads-admin-main">
  <div class="container">
    <div class="section-title compact">
      <h2>Lead Generation Dashboard</h2>
      <p>Luxury popup email captures.</p>
    </div>

    <section class="leads-admin-panel">
      <div class="leads-admin-stats">Total Leads: <strong data-total-leads>0</strong></div>
      <div class="leads-admin-actions">
        <button type="button" data-export-leads>Export CSV</button>
        <a class="secondary" href="index.html">Back to Homepage</a>
      </div>

      <table class="leads-table">
        <thead>
          <tr>
            <th>Email</th>
            <th>Coupon</th>
            <th>Created At</th>
          </tr>
        </thead>
        <tbody data-leads-body>
          <tr><td colspan="3">Loading leads...</td></tr>
        </tbody>
      </table>
    </section>
  </div>
</main>

<script src="js/lead-popup.js"></script>
</body>
</html>
